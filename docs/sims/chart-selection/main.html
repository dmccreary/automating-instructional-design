<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Chart Selection Matrix MicroSim</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Chart Selection Matrix</h1>

        <div class="toolbar">
            <label class="toggle">
                <input type="checkbox" id="advancedToggle">
                Show advanced charts
            </label>
            <button type="button" id="practiceBtn" class="btn">Practice Scenario</button>
        </div>

        <div class="coach" id="coach" role="status" aria-live="polite"></div>

        <table class="matrix" aria-label="Chart selection matrix: data type by question type">
            <thead>
                <tr id="matrixHead"></tr>
            </thead>
            <tbody id="matrixBody">
                <!-- Generated by chart-selection.js from data.json -->
            </tbody>
        </table>

        <div class="legend" id="legend"></div>

        <div class="detail" id="detail">
            <div class="detail-text">
                <div class="detail-heading">
                    <span class="family-dot" id="detailDot"></span>
                    <span class="detail-name" id="detailName"></span>
                    <span class="pill" id="detailPill"></span>
                </div>
                <div class="detail-context" id="detailContext"></div>
                <p><strong id="detailUseLabel">Use when:</strong> <span id="detailUseWhen"></span></p>
                <p id="detailDescription"></p>
                <p><strong>Example:</strong> <span id="detailExample"></span></p>
                <p class="detail-tip" id="detailTip"></p>
            </div>
            <div class="detail-chart">
                <canvas id="sampleChart" role="img" aria-label="Sample chart"></canvas>
                <div class="sample-title" id="sampleTitle"></div>
                <button type="button" id="showMeBtn" class="btn" title="Draw this chart again with new sample data">Show Me</button>
            </div>
        </div>
    </main>
    <script src="chart-selection.js"></script>
</body>
</html>
